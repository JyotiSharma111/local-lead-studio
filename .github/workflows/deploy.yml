name: Deploy DEV

on:
  push:
    branches:
      -dev

jobs:
  deploy:
    runs-on: ubuntu latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build